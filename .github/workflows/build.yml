name: Build RunCheck.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Grant write access to create releases and attach binary artifacts
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name RunCheck --add-data "runcheck/data;runcheck/data" app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunCheck-windows
          path: dist/RunCheck.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RunCheck.exe
